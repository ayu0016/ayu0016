
name: Trainer Journey

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: trainer-journey-main
  cancel-in-progress: false

jobs:
  update-trainer-journey:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.TRAINER_JOURNEY_PAT }}
        run: python scripts/fetch_contributions.py

      - name: Calculate trainer stats
        run: python scripts/calculate_stats.py

      - name: Generate SVG
        run: python scripts/generate_svg.py

      - name: Commit updated asset
        run: |
          git config user.name "trainer-journey-bot"
          git config user.email "actions@users.noreply.github.com"

          git add assets/trainer-journey.svg data/contributions.json data/trainer.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update trainer journey card"

          git pull --rebase origin main
          git push origin main
